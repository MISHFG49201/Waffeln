.mode-btn.active { background: #1D9E75; color: #fff; border-color: #1D9E75; font-weight: bold; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.flip-wrap { perspective: 600px; height: 175px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.45s ease; }
.flip-wrap.flipped .flip-inner { transform: rotateY(180deg); }
.flip-front, .flip-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 14px; border: 2px solid #e8d5b0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
}
.flip-front { background: #fff; }
.flip-back { background: #fdf0e0; transform: rotateY(180deg); }
.card-svg { width: 90px; height: 90px; }
.card-emoji-big { font-size: 58px; line-height: 1; }
.card-tap { font-size: 11px; color: #b09070; margin-top: 8px; }
.card-word { font-size: 16px; font-weight: bold; color: #5a3010; text-align: center; line-height: 1.3; }
.card-article { font-size: 14px; color: #c06020; margin-top: 6px; font-style: italic; }

.reveal-all-btn:hover { background: #c06020; color: #fff; }
.quiz-box { background: #fff; border: 2px solid #e8d5b0; border-radius: 16px; padding: 1.5rem; text-align: center; }
.quiz-svg { width: 120px; height: 120px; margin: 0 auto 14px; display: block; }
.quiz-emoji-big { font-size: 80px; display: block; margin-bottom: 14px; }
.quiz-subtext { font-size: 14px; color: #8a6040; margin-bottom: 1.25rem; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quiz-opt { padding: 14px 8px; border-radius: 10px; border: 2px solid #e8d5b0; background: #fdf8f0; cursor: pointer; font-size: 14px; color: #2a2a2a; font-family: Georgia, serif; transition: all 0.15s; line-height: 1.3; }
.quiz-opt:hover:not(:disabled) { border-color: #c06020; background: #fdf0e0; }
.quiz-opt.correct { background: #d4f0e0; color: #0a6040; border-color: #1D9E75; font-weight: bold; }
.quiz-opt.wrong { background: #fde0d8; color: #a03010; border-color: #D85A30; }
.quiz-opt:disabled { cursor: default; }
.quiz-feedback { margin-top: 1rem; font-size: 15px; font-weight: bold; min-height: 22px; }
.quiz-feedback.ok { color: #1D9E75; }
.quiz-feedback.fail { color: #D85A30; }
.progress { display: flex; gap: 5px; justify-content: center; margin-bottom: 1.25rem; flex-wrap: wrap; }
.prog-dot { width: 12px; height: 12px; border-radius: 50%; background: #e8d5b0; }
.prog-dot.done-ok { background: #1D9E75; }
.prog-dot.done-fail { background: #D85A30; }
.luecke-box { background: #fff; border: 2px solid #e8d5b0; border-radius: 16px; padding: 1.5rem; }
.luecke-svg { width: 80px; height: 80px; display: block; margin-bottom: 10px; }
.luecke-emoji { font-size: 48px; display: block; margin-bottom: 10px; }
.luecke-sentence { font-size: 18px; line-height: 2.4; color: #2a2a2a; margin-bottom: 0.5rem; }
.luecke-input { border: 2px solid #e8d5b0; border-radius: 8px; padding: 6px 12px; font-size: 16px; width: 190px; color: #2a2a2a; background: #fdf8f0; font-family: Georgia, serif; }
.luecke-input.ok { border-color: #1D9E75; background: #d4f0e0; color: #0a6040; }
.luecke-input.fail { border-color: #D85A30; background: #fde0d8; color: #a03010; }
.luecke-hint { font-size: 14px; color: #8a6040; margin-top: 10px; min-height: 20px; font-weight: bold; }
.check-btn { margin-top: 14px; padding: 10px 28px; border-radius: 10px; border: 2px solid #1D9E75; background: #1D9E75; color: #fff; font-size: 14px; font-family: Georgia, serif; cursor: pointer; transition: all 0.15s; }

.score-box { text-align: center; padding: 2rem; }
.score-num { font-size: 52px; font-weight: bold; color: #5a3010; }
.score-label { font-size: 16px; color: #8a6040; margin-top: 6px; }

.again-btn { margin-top: 1.5rem; padding: 12px 32px; border-radius: 10px; border: 2px solid #c06020; background: #c06020; color: #fff; font-size: 15px; font-family: Georgia, serif; cursor: pointer; }

</head>

let allFlipped=false;

function buildTabs(){
  document.getElementById('cat-tabs').innerHTML=Object.keys(data).map(c=>
    `<button class="tab${c===currentCat?' active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join('');
}
function setCat(c){currentCat=c;quizIdx=0;quizScore=0;quizResults=[];quizItems=[];lueckeIdx=0;lueckeItems=[];allFlipped=false;buildTabs();render();}
function setMode(m){currentMode=m;quizIdx=0;quizScore=0;quizResults=[];quizItems=[];lueckeIdx=0;lueckeItems=[];allFlipped=false;
  document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',['cards','quiz','luecke'][i]===m));render();}
function render(){if(currentMode==='cards')renderCards();else if(currentMode==='quiz')renderQuiz();else renderLuecke();}

function renderCards(){
  const items=data[currentCat];
  document.getElementById('content').innerHTML=`
    <div class="card-grid">
      ${items.map((it,i)=>`
        <div class="flip-wrap" id="fw${i}" onclick="flipCard(${i})">
          <div class="flip-inner">
            <div class="flip-front">
              ${visual(it,'card-svg','card-emoji-big')}
              <span class="card-tap">Tippen →</span>
            </div>
            <div class="flip-back">
              <div class="card-word">${it.short}</div>
              <div class="card-article">${it.de.split(' ')[0]}</div>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <button class="reveal-all-btn" onclick="flipAll()">${allFlipped?'Alle verbergen':'Alle aufdecken'}</button>`;
}

function flipCard(i){document.getElementById('fw'+i).classList.toggle('flipped');}
function flipAll(){
  allFlipped=!allFlipped;
  data[currentCat].forEach((_,i)=>{const fw=document.getElementById('fw'+i);if(fw)allFlipped?fw.classList.add('flipped'):fw.classList.remove('flipped');});
  document.querySelector('.reveal-all-btn').textContent=allFlipped?'Alle verbergen':'Alle aufdecken';
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderQuiz(){
  if(!quizItems.length)quizItems=shuffle(data[currentCat]);
  if(quizIdx>=quizItems.length){renderScore();return;}
  const item=quizItems[quizIdx];
  const wrongs=shuffle(data[currentCat].filter(x=>x.de!==item.de)).slice(0,3).map(x=>x.short);
  const options=shuffle([item.short,...wrongs]);
  const dots=quizItems.map((_,i)=>{let cls='prog-dot';if(i<quizResults.length)cls+=quizResults[i]?' done-ok':' done-fail';return`<div class="${cls}"></div>`;}).join('');
  document.getElementById('content').innerHTML=`
    <div class="progress">${dots}</div>
    <div class="quiz-box">
      ${visual(item,'quiz-svg','quiz-emoji-big')}
      <div class="quiz-subtext">Welches Wort passt zum Bild?</div>
      <div class="quiz-options">
        ${options.map(opt=>`<button class="quiz-opt" onclick="checkQuiz(this,${JSON.stringify(opt)},${JSON.stringify(item.short)})">${opt}</button>`).join('')}
      </div>
      <div class="quiz-feedback" id="qfb"></div>
    </div>`;
}

function checkQuiz(btn,chosen,correct){
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const ok=chosen===correct;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok)document.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
  document.getElementById('qfb').textContent=ok?'✓ Richtig!':'✗ Richtig: '+correct;
  document.getElementById('qfb').className='quiz-feedback '+(ok?'ok':'fail');
  if(ok)quizScore++;
  quizResults.push(ok);
  setTimeout(()=>{quizIdx++;renderQuiz();},1300);
}

function renderScore(){
  const pct=Math.round(quizScore/quizItems.length*100);
  const stars=pct>=80?'⭐⭐⭐':pct>=50?'⭐⭐':'⭐';
  const msg=pct>=80?'Super gemacht!':pct>=50?'Gut gemacht!':'Weiter üben!';
  document.getElementById('content').innerHTML=`
    <div class="quiz-box score-box">
      <div class="score-stars">${stars}</div>
      <div class="score-num">${quizScore}/${quizItems.length}</div>
      <div class="score-label">${msg} (${pct}%)</div>
      <button class="again-btn" onclick="resetQuiz()">Nochmal spielen</button>
    </div>`;
}
function resetQuiz(){quizIdx=0;quizScore=0;quizResults=[];quizItems=[];renderQuiz();}

const lueckeSentences={
  "Zutaten":[
    {text:"Du brauchst ___ für den Teig.",answer:"Mehl",svgKey:"mehl"},
    {text:"Gib ___ in den Teig, damit er süß wird.",answer:"Zucker",em:"🍬"},
    {text:"Rühre ___ unter, damit der Teig cremig wird.",answer:"Butter",em:"🧈"},
    {text:"Gieße ___ dazu, damit der Teig flüssig wird.",answer:"Milch",em:"🥛"},
    {text:"Streue ___ über die fertigen Waffeln.",answer:"Puderzucker",svgKey:"puderzucker"},
    {text:"Gib ___ für einen feinen Duft in den Teig.",answer:"Vanillezucker",svgKey:"vanillezucker"},
    {text:"Schlage die ___ steif und gib sie obendrauf.",answer:"Sahne",svgKey:"sahne"},
  ],
  "Utensilien":[
    {text:"Der Teig wird im ___ gebacken.",answer:"Waffeleisen",svgKey:"waffeleisen"},
    {text:"Rühre den Teig in einer großen ___.",answer:"Schüssel",svgKey:"schuessel"},
    {text:"Mit dem ___ kannst du schnell rühren.",answer:"Handmixer",svgKey:"handmixer"},
    {text:"Kratze den Teig mit dem ___ aus der Schüssel.",answer:"Teigschaber",svgKey:"teigschaber"},
    {text:"Mit der ___ gießt du den Teig ins Eisen.",answer:"Kelle",svgKey:"kelle"},
  ],
  "Verben":[
    {text:"Du musst alle Zutaten gut ___.",answer:"vermischen",em:"🔄"},
    {text:"Den Teig in das heiße Eisen ___.",answer:"gießen",em:"🫗"},
    {text:"Die Waffeln ca. 3 Minuten ___.",answer:"backen",em:"🔥"},
    {text:"Das Mehl genau ___.",answer:"abwiegen",em:"⚖️"},
    {text:"Das Waffeleisen ___, bevor du anfängst.",answer:"einstecken",em:"🔌"},
  ],
  "Zeitadverbien":[
    {text:"___ das Waffeleisen einstecken.",answer:"Zuerst",em:"1️⃣"},
    {text:"___ alle Zutaten in die Schüssel geben.",answer:"Dann",em:"2️⃣"},
    {text:"___ den Teig ins Eisen gießen.",answer:"Anschließend",em:"🔜"},
    {text:"___ die Waffeln servieren.",answer:"Zum Schluss",em:"🏁"},
    {text:"___ den Teig gut rühren.",answer:"Währenddessen",em:"⏱️"},
  ]
};

function renderLuecke(){
  if(!lueckeItems.length)lueckeItems=shuffle(lueckeSentences[currentCat]||lueckeSentences["Zutaten"]);
  if(lueckeIdx>=lueckeItems.length){
    document.getElementById('content').innerHTML=`
      <div class="quiz-box score-box">
        <div class="score-stars">🎉</div><div class="score-num">Fertig!</div>
        <div class="score-label">Alle Lückentexte geschafft!</div>
        <button class="again-btn" onclick="resetLuecke()">Nochmal</button>
      </div>`;
    return;
  }
  const item=lueckeItems[lueckeIdx];
  const vis=item.svgKey?`<div class="luecke-svg">${svgs[item.svgKey]}</div>`:`<span class="luecke-emoji">${item.em}</span>`;
  const display=item.text.replace('___','<input class="luecke-input" id="linput" placeholder="?" autocomplete="off"/>');
  document.getElementById('content').innerHTML=`
    <div class="luecke-box">
      <div style="font-size:13px;color:#8a6040;margin-bottom:10px">${lueckeIdx+1} / ${lueckeItems.length}</div>
      ${vis}
      <div class="luecke-sentence">${display}</div>
      <div class="luecke-hint" id="lhint"></div>
      <button class="check-btn" onclick="checkLuecke()">Überprüfen</button>
    </div>`;
  document.getElementById('linput').addEventListener('keydown',e=>{if(e.key==='Enter')checkLuecke();});
}

function checkLuecke(){
  const inp=document.getElementById('linput');if(!inp)return;
  inp.disabled=true;
  const item=lueckeItems[lueckeIdx];
  const ok=inp.value.trim().toLowerCase()===item.answer.toLowerCase();
  inp.classList.add(ok?'ok':'fail');
  const hint=document.getElementById('lhint');
  hint.textContent=ok?'✓ Richtig!':'✗ Richtig wäre: '+item.answer;
  hint.style.color=ok?'#1D9E75':'#D85A30';
  const btn=document.querySelector('.check-btn');
  if(btn){btn.textContent='Weiter →';btn.onclick=()=>{lueckeIdx++;renderLuecke();};}
}
function resetLuecke(){lueckeIdx=0;lueckeItems=[];renderLuecke();}

buildTabs();render();
</script>
</body>
</html>
